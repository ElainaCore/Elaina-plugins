# .github/workflows/sync-fork.yml
name: Sync Fork from Upstream

on:
  schedule:
    # 每6小时检查一次，你可以调整时间
    - cron: '0 */6 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          # 需要完整历史记录才能同步
          fetch-depth: 0
          # 使用GITHUB_TOKEN自动认证
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Add upstream repository
        run: |
          # 这里改成你的上游仓库地址
          # 格式：https://github.com/原作者/原仓库.git
          git remote add upstream https://github.com/yhkj-nb/Elaina-plugins.git
          git fetch upstream
          
      - name: Merge upstream changes
        run: |
          # 同步main分支，如果上游是master则改成master
          git checkout main
          git merge upstream/main --no-ff -m "🔄 Auto-sync from upstream at $(date '+%Y-%m-%d %H:%M:%S')"
          
      - name: Push to fork
        run: |
          git push origin main
